<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TG Post Generator</title>
<style>
  :root{
    --bg:#0f1115; --card:#171a21; --border:#2a2e38; --text:#e8eaed;
    --muted:#9aa0aa; --accent:#5b8cff; --accent2:#3fd98a;
  }
  :root[data-theme="light"]{
    --bg:#f4f5f7; --card:#ffffff; --border:#e2e4e9; --text:#1a1d23;
    --muted:#6b7280; --accent:#3b6fe0; --accent2:#12a468;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 40px;}
  h1{font-size:20px;margin:4px 0 18px;}
  h2{font-size:13px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:1px;}
  .card{
    background:var(--card); border:1px solid var(--border);
    border-radius:14px; padding:16px; margin-bottom:14px;
  }
  .toprow{display:flex;justify-content:space-between;align-items:center;}
  .toprow .lbl{font-size:13px;color:var(--muted);}

  .row{
    display:flex; align-items:center; gap:10px; padding:9px 0;
    border-bottom:1px solid var(--border);
  }
  .row:last-child{border-bottom:none;}
  .row label.tag{
    font-size:13px; color:var(--muted); width:100px; flex-shrink:0;
  }
  .row input[type="text"]{
    flex:1; min-width:0; padding:9px 11px; border-radius:9px;
    border:1px solid var(--border); background:var(--bg); color:var(--text);
    font-size:14px; outline:none;
  }
  .row input[type="text"]:focus{border-color:var(--accent);}

  .switch{
    position:relative; width:36px; height:20px; flex-shrink:0; cursor:pointer;
  }
  .switch input{opacity:0; width:0; height:0;}
  .slider{
    position:absolute; inset:0; background:var(--border); border-radius:20px;
    transition:.15s;
  }
  .slider::before{
    content:""; position:absolute; height:16px; width:16px; left:2px; top:2px;
    background:#fff; border-radius:50%; transition:.15s;
  }
  .switch input:checked + .slider{background:var(--accent);}
  .switch input:checked + .slider::before{transform:translateX(16px);}

  .out-card{position:relative;}
  #output{
    white-space:pre-wrap; word-break:break-word; font-size:15px;
    line-height:1.6; min-height:40px;
  }
  #output b{color:var(--accent2);}
  .copybtn{
    margin-top:12px; width:100%; padding:11px; border:none; border-radius:9px;
    background:var(--accent); color:#fff; font-size:15px; font-weight:600;
    cursor:pointer;
  }
  .copybtn.copied{background:var(--accent2);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Telegram Post Generator</h1>

  <div class="card">
    <div class="toprow">
      <span class="lbl">Bold Titles</span>
      <label class="switch">
        <input type="checkbox" id="boldToggle" checked>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <span class="tag">Title</span>
      <input type="text" id="title">
      <label class="switch"><input type="checkbox" id="title_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Tag</span>
      <input type="text" id="tag">
      <label class="switch"><input type="checkbox" id="tag_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Version</span>
      <input type="text" id="version">
      <label class="switch"><input type="checkbox" id="version_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Maintainer</span>
      <input type="text" id="maintainer">
      <label class="switch"><input type="checkbox" id="maintainer_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Checksum</span>
      <input type="text" id="checksum">
      <label class="switch"><input type="checkbox" id="checksum_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Build Date</span>
      <input type="text" id="builddate">
      <label class="switch"><input type="checkbox" id="builddate_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Credit</span>
      <input type="text" id="credit">
      <label class="switch"><input type="checkbox" id="credit_on" checked><span class="slider"></span></label>
    </div>
  </div>

  <div class="card">
    <h2>Buttons (links)</h2>
    <div class="row">
      <span class="tag">Download</span>
      <input type="text" id="btn_download">
      <label class="switch"><input type="checkbox" id="btn_download_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Support Group</span>
      <input type="text" id="btn_supportgroup">
      <label class="switch"><input type="checkbox" id="btn_supportgroup_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Screenshot</span>
      <input type="text" id="btn_screenshot">
      <label class="switch"><input type="checkbox" id="btn_screenshot_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Support Us</span>
      <input type="text" id="btn_supportus">
      <label class="switch"><input type="checkbox" id="btn_supportus_on" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <span class="tag">Changelogs</span>
      <input type="text" id="btn_changelog">
      <label class="switch"><input type="checkbox" id="btn_changelog_on" checked><span class="slider"></span></label>
    </div>
  </div>

  <div class="card out-card">
    <div id="output"></div>
    <button class="copybtn" id="copyBtn">Copy for Telegram</button>
  </div>
</div>

<script>
  const fields = ["version","maintainer","checksum","builddate","credit"];
  const labels = {version:"Version", maintainer:"Maintainer", checksum:"Checksum", builddate:"Build Date", credit:"Credit"};

  const titleInput = document.getElementById("title");
  const titleOn = document.getElementById("title_on");
  const tagInput = document.getElementById("tag");
  const tagOn = document.getElementById("tag_on");
  const boldToggle = document.getElementById("boldToggle");
  const output = document.getElementById("output");
  const copyBtn = document.getElementById("copyBtn");

  function val(id){ return document.getElementById(id).value.trim(); }
  function on(id){ return document.getElementById(id).checked; }

  function buttonRow(label1, id1, label2, id2){
    const v1 = (id1 && on(id1+"_on")) ? val(id1) : "";
    const v2 = (id2 && on(id2+"_on")) ? val(id2) : "";
    const parts = [];
    if(v1) parts.push(`[${label1}](buttonurl://${v1})`);
    if(v2) parts.push(v1 ? `[${label2}](buttonurl://${v2}:same)` : `[${label2}](buttonurl://${v2})`);
    return parts;
  }

  function buildRawText(){
    const bold = boldToggle.checked;
    const lines = [];

    if(titleOn.checked && titleInput.value.trim()){
      lines.push(titleInput.value.trim());
    }
    if(tagOn.checked && tagInput.value.trim()){
      lines.push(tagInput.value.trim());
    }
    if(lines.length) lines.push("");

    fields.forEach(id => {
      const onBox = document.getElementById(id+"_on");
      const v = document.getElementById(id).value.trim();
      if(onBox.checked && v){
        const lbl = bold ? `**${labels[id]}**` : labels[id];
        lines.push(`${lbl} : ${v}`);
      }
    });

    const btnLines = [];
    const row1 = buttonRow("Download","btn_download","Support Group","btn_supportgroup");
    const row2 = buttonRow("Screenshot","btn_screenshot","Support Us","btn_supportus");
    const row3 = buttonRow("Changelogs","btn_changelog","","");

    if(row1.length){ btnLines.push(...row1); }
    if(row2.length){ btnLines.push(...row2); }
    if(row3.length){ btnLines.push(...row3.filter(Boolean)); }

    if(btnLines.length){
      lines.push("");
      lines.push(...btnLines);
    }

    return lines.join("\n");
  }

  function render(){
    const raw = buildRawText();
    const esc = raw.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    const html = esc.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    output.innerHTML = html;
  }

  document.querySelectorAll('input[type="text"]').forEach(el => el.addEventListener("input", render));
  document.querySelectorAll('input[type="checkbox"]').forEach(el => el.addEventListener("change", render));

  render();

  function execCommandCopy(text){
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.top = "0";
    ta.style.left = "0";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  copyBtn.addEventListener("click", async () => {
    const text = buildRawText();
    if(!text){
      copyBtn.textContent = "Nothing to copy";
      setTimeout(() => { copyBtn.textContent = "Copy for Telegram"; }, 1500);
      return;
    }

    // execCommand runs synchronously within the click's user-gesture
    // window, so it's tried first; the async Clipboard API is the
    // fallback for browsers where execCommand has been removed.
    let success = execCommandCopy(text);

    if(!success && navigator.clipboard){
      try{
        await navigator.clipboard.writeText(text);
        success = true;
      }catch(e){ success = false; }
    }

    copyBtn.textContent = success ? "Copied!" : "Copy failed";
    copyBtn.classList.toggle("copied", success);
    setTimeout(() => {
      copyBtn.textContent = "Copy for Telegram";
      copyBtn.classList.remove("copied");
    }, 1500);
  });
</script>
</body>
</html>
